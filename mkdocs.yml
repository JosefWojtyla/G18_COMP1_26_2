site_name: Construção de Compiladores
site_description: Documentação do projeto de construção de um compilador
site_author: Grupo 18

theme:
  name: material
  language: pt-BR

  palette:
    scheme: slate
    primary: black
    accent: grey

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

  font:
    text: Roboto
    code: Roboto Mono



nav:
  - Início: index.md

  - Compilador:
      - linguagem e Escopo: linguagem-e-escopo.md
      - Análise Léxica: analise-lexica.md
      - Análise Sintática: analise-sintatica.md
      - Análise Semântica: analise-semantica.md
      - Código Intermediário: codigo-intermediario.md
      - Código final: codigo-final.md
      - Decisões: decisoes.md


  - Planejamento:
      - Visão geral: planejamento.md
      - Sprints:
          - Sprint 01: sprints/sprint-01.md
          - Sprint 02: sprints/sprint-02.md

  - Pontos de Entrega:
      - Ponto de controle 1: entregas/entrega-01.md
      - Ponto de controle 2: entregas/entrega-02.md

  - Entrega final: 
      - Entrega final: entregas/entrega-final.md

  - Referências: referencias.md